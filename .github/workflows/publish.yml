name: Build and publish

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - versions.env
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Load pinned versions
        shell: bash
        run: grep -Ev '^[[:space:]]*(#|$)' versions.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub publishing is currently disabled.
      # - uses: docker/login-action@v4
      #   with:
      #     registry: docker.io
      #     username: ${{ vars.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/pa11y-dashboard
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.PA11Y_DASHBOARD_VERSION }}
            type=sha
          labels: |
            org.opencontainers.image.title=Pa11y Dashboard
            org.opencontainers.image.description=Containerized Pa11y Dashboard for monitoring web accessibility
            org.opencontainers.image.authors=Pa11y developers and contributors
            org.opencontainers.image.url=https://github.com/pa11y/pa11y-dashboard
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md
            org.opencontainers.image.source=https://github.com/pa11y/pa11y-dashboard
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            PA11Y_DASHBOARD_VERSION=${{ env.PA11Y_DASHBOARD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
